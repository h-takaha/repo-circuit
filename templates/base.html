<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf }}">
<title>{% block title %}repo-circuit{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path class="ico" d="M2 14H8M20 14H26M8 14L18 7"></path><circle class="ico" cx="8" cy="14" r="2"></circle><circle class="ico" cx="20" cy="14" r="2"></circle></svg>
    repo-circuit
  </a>
  <nav class="tabs" aria-label="画面">
    <a class="tab {{ 'on' if active == 'panel' }}" href="/">配電盤</a>
    <a class="tab {{ 'on' if active == 'circuit' }}" href="/repo">回路図</a>
    <a class="tab {{ 'on' if active == 'tray' }}" href="/tray">部品トレイ</a>
    <a class="tab {{ 'on' if active == 'guide' }}" href="/guide">凡例</a>
  </nav>
  <div class="who">{% if demo %}<span class="demo-badge">デモデータ</span> {% endif %}{{ owner }}</div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
